# Build and deploy from `master`, so what ships is what was reviewed.
#
# `npm run deploy` builds on a laptop that holds `.env.local` and ships whatever
# branch happens to be checked out. The App Check debug token reached GitHub
# Pages twice through exactly that, and both times the gate that would have
# stopped it existed — on a branch that was not the one being deployed. See
# docs/decisions/debug-token-leak.md and docs/decisions/ci-deploy.md.
#
# A runner fixes both halves. It has no `.env.local`, so the token is not on the
# build machine and inlining it is impossible rather than merely gated. And it
# builds one ref, so "what shipped" and "what was reviewed" cannot drift apart.
#
# NOTE: the name of the debug-token variable does not appear anywhere in this
# file, and `npm run check-bundle` refuses a build if any workflow names it.
# The deploy job is not supposed to know that variable exists. If you are here
# to add it for an end-to-end runner, the answer is the Firebase emulator —
# docs/decisions/audit-backlog.md.
#
# Actions used are GitHub's own (checkout, setup-node, setup-java, cache,
# upload/download-artifact), plus **one that is not**: Google's
# `google-github-actions/auth`, in the `rules` job only, pinned to a commit.
# That is the accepted cost of keyless rules publishing (D5, Greg, 15 October
# 2026, docs/decisions/public-scale.md): the alternative was a long-lived
# service-account key in a GitHub secret, which opens the vault if it leaks.
# The site is published with the `gh-pages` npm package and the rules with
# `firebase-tools`, both already in devDependencies — the same two tools a hand
# deploy uses — so nothing else new enters the deploy path.
#
# The rules job holds a short-lived Google credential that can only be minted on
# `master`: Google's own pool refuses any other ref. It is still
# not the debug token, and nothing here can reach the live project as a client,
# which is why `npm run check-rules` stays a local step after a merge.
#
# The four majors are deliberately uneven, and levelling them to one number
# re-breaks this. Node 20 is deprecated, so every action here has to declare
# `runs.using: node24`, and the major where that happened differs per action:
# checkout and setup-node at v5, but upload-artifact only at v6 and
# download-artifact only at v7. Their v5 releases advertise Node 24 *support*
# while still defaulting to node20 — GitHub's own v6/v7 notes say so in as many
# words — so pinning the artifact pair to v5 leaves the deprecation warning
# exactly where it was. Checked against each `action.yml`, not the changelogs.
# Held at the lowest major that clears node20: the artifact handoff is the
# mechanism this workflow exists for, and upload v7 / download v8 change how
# artefacts are zipped and hashed, which is not a ride worth taking for free.
#
# Every action is pinned to a commit, with its tag beside it, GitHub's own
# included (22 October 2026). A tag can be moved, and in 2026 it was —
# actions-cool and codfish had theirs repointed at code that read the runner's
# secrets. Each SHA is the commit its major pointed at on the day, read off
# `git ls-remote --tags`, so pinning changed nothing that runs. Dependabot
# (.github/dependabot.yml) raises a PR when one of them has an advisory.
#
# The two jobs that hold a credential — `rules` (the Google OIDC token) and
# `deploy` (a write-scoped GITHUB_TOKEN) — install with `--ignore-scripts`. A
# compromised package's install script runs inside `npm ci`, before any step
# of ours, with whatever that job can reach; the 2026 npm worms (TanStack,
# AntV, Red Hat) harvested CI credentials exactly that way. Neither job needs
# a script: firebase-tools, tsx and gh-pages run without them, proved from a
# clean `npm ci --ignore-scripts` on 22 October 2026
# (docs/decisions/security-sweep-oct-2026.md). build, checks and e2e still run
# them — they build and drive a browser, and hold nothing that writes. Those
# three restore `node_modules` from a cache; the two credentialed jobs never do.
#
# **Plan comes first, and decides how much of the rest runs** (22 October 2026,
# docs/decisions/ci-deploy.md, "Lead time"). A change that touches only
# documentation builds, tests and deploys nothing. A push to master whose tree
# a pull-request run has already built and passed publishes that run's `dist`
# instead of building and testing the same bytes again. Both were most of a
# 16-minute go-live. The logic is in .github/scripts/ci-plan.sh, runnable
# against real history. If Plan fails, everything runs: a skipped job counts as
# a passed required check, so nothing here may skip on a plan it did not get.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The runs and artefacts APIs, to find a passed PR build to reuse.
      actions: read
      # The pulls API, for a pull request's changed files.
      pull-requests: read
    outputs:
      code: ${{ steps.plan.outputs.code }}
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
      whats_new: ${{ steps.plan.outputs.whats_new }}
      ticket: ${{ steps.plan.outputs.ticket }}
    steps:
      # Depth 2: a push compares the commit with its first parent.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/ci-plan.sh | tee -a "$GITHUB_OUTPUT"

  # Verify used to be one job: install, typecheck, lint, test, build, in that
  # order, and every Playwright shard waited the whole 110s for it. The shards
  # need only `dist`, so the build is its own job and they start as soon as it
  # lands; typecheck, lint and test run beside them. "Verify and build" is kept
  # as the job that joins the two, because the ruleset requires that name and
  # `rules` and `deploy` read its result (PROJ-93, 31 October 2026,
  # docs/decisions/ci-speed.md).
  #
  # Both run unless Plan succeeded *and* said there is nothing to build: docs
  # only, or a passed PR build to publish. A failed Plan runs them in full.
  build:
    name: Build
    needs: plan
    if: >-
      ${{ !cancelled() && !(needs.plan.result == 'success'
      && (needs.plan.outputs.code != 'true' || needs.plan.outputs.reuse_run != '')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      # `node_modules` itself, keyed on the exact lockfile and Node version, so
      # a hit is the tree `npm ci` would have written; ~27s of `npm ci` becomes
      # a few seconds of restore. A miss installs as before. A pull request can
      # read master's caches but master never reads a pull request's, so a
      # branch cannot plant a tree that ships. The two jobs that hold a
      # credential (`rules`, `deploy`) never use it and still install clean.
      - id: modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        # Only the values that are *supposed* to ship. Repository variables, not
        # secrets: they identify the project, they do not authorise access — the
        # rules do that. Vite inlines every VITE_-prefixed variable it can see,
        # which is precisely why this list is written out rather than passed
        # through wholesale.
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY }}
        run: npm run build

      # Built once, here, and handed onward. The job that publishes must not
      # rebuild: a second build is a second chance for the shipped artefact to
      # differ from the checked one, which is the whole failure this workstream
      # exists to stop. The e2e job downloads this same artefact and serves it
      # with vite preview, so the browser drives the exact bundle that is about
      # to go live.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

      # Names the exact tree this run built. When master later has the same
      # tree, its run finds this marker and publishes this run's `dist` rather
      # than building it again (ci-plan.sh). Pull requests only: master's own
      # builds are never reused. Kept as long as `dist`. ci-plan.sh also
      # requires the whole run to have passed, so a marker from a run whose
      # tests failed is never chosen.
      - name: Record the tree this run built
        id: tree
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/tree/tree"
          echo "hash=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'pull_request'
        with:
          name: tree-${{ steps.tree.outputs.hash }}
          path: ${{ runner.temp }}/tree/
          retention-days: 7
          if-no-files-found: error

  checks:
    name: Typecheck, lint and test
    needs: plan
    if: >-
      ${{ !cancelled() && !(needs.plan.result == 'success'
      && (needs.plan.outputs.code != 'true' || needs.plan.outputs.reuse_run != '')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      # The same cache as `build`: see there.
      - id: modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - run: npm run typecheck
      - run: npm run lint

      # Offline by design. Anything under `scripts/` that talks to the network or
      # the live project is excluded from the suite on purpose, so this needs no
      # Firebase credentials of any kind.
      - run: npm test

  verify:
    name: Verify and build
    needs: [plan, build, checks]
    if: >-
      ${{ !cancelled() && !(needs.plan.result == 'success'
      && (needs.plan.outputs.code != 'true' || needs.plan.outputs.reuse_run != '')) }}
    runs-on: ubuntu-latest
    steps:
      # A change players can see goes live with its line on the What's new page
      # (Greg, 22 October 2026: #110 shipped without one). Plan decides from the
      # changed files; this fails the required check so the PR cannot merge.
      - name: What's new carries this change
        if: needs.plan.outputs.whats_new == 'missing'
        run: |
          echo "::error title=What's new::This PR changes what players see (src/ or public/) but not src/lib/updates.ts. Add a line in player words, or write \"What's new: none — <why>\" in the PR description or a commit message. An empty commit re-runs CI."
          exit 1

      # A PR names its Jira ticket, so whoever takes it live can move the
      # ticket to Done (PROJ-66, 28 October 2026). Same shape as the check above.
      - name: PR names its Jira ticket
        if: needs.plan.outputs.ticket == 'missing'
        run: |
          echo "::error title=Jira ticket::Name the ticket (PROJ-<n>) in the PR title, branch, description or a commit message, or write \"Ticket: none — <why>\" in the description or a commit message. An empty commit re-runs CI."
          exit 1

      - name: Built, typechecked, linted and tested
        env:
          BUILD: ${{ needs.build.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          echo "build: $BUILD, checks: $CHECKS"
          test "$BUILD" = success
          test "$CHECKS" = success

  # Talks to the Firebase emulator, never the live project. Must never name the
  # App Check debug-token environment variable — `check-bundle` refuses a build
  # if this file does. Give the runner the emulator, not a token.
  # Java 21 is for the Firestore emulator. setup-java is v5 (node24), not v4.
  #
  # Seven jobs at once, each on its own runner with its own emulators, so no two
  # specs ever share one. The groups are `e2e/shards.json`. Six were balanced
  # by run 40151240593 (25 Oct 2026) and the Slop Cannon's two specs kept apart:
  # they play three whole rounds between them, 677s when they shared a shard
  # (#154). Re-cut into seven on 31 Oct from run 41080509766 (PROJ-93): the
  # Commentator's round, 258s, is the floor no grouping goes under, so every
  # other shard is filled to about that and no more — two whole-round specs
  # each, or one long one and the quick rules specs.
  # `scripts/e2e-shards.test.ts` fails if a spec is in no group or this list
  # does not match the groups. Inside a shard it is still one worker: each spec
  # wipes its emulators first (e2e/isolate.ts).
  e2e-shard:
    name: Playwright shard ${{ matrix.shard }}
    # The build alone, not verify: typecheck, lint and test run beside the
    # shards rather than ahead of them. `!cancelled()` rather than the default:
    # when Plan fails, build still runs, and so must this.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # The slowest shard ran ~5 min of specs when this was written; 15 leaves
    # room for a slow runner without letting a hang hold a PR for half an hour.
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one red file does not hide another.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      # As in `build`, plus Playwright's Chromium, which is pinned by the same
      # lockfile. `playwright install` below then finds it already there.
      - id: modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # The build job's `dist`, so every shard drives the bundle that is about to go live.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      # The browser only, not `--with-deps`. The runner image already carries
      # every library Chromium needs; `--with-deps` added fonts and upgrades
      # from azure.archive.ubuntu.com, and on 26 Oct that mirror took 520–637s
      # for 25.9 MB on 3 of 5 runs, twice past the 15-minute timeout (#154).
      # The download itself is ~15s. If the image ever stops carrying a
      # library, the launch check fails and only then do we go to apt.
      - run: npx playwright install chromium

      - name: Chromium launches, or fetch its system libraries
        run: |
          node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" \
            || npx playwright install-deps chromium

      # `npm run e2e` with this shard's files. Paths come from the repo's own
      # JSON, never from the event, so nothing a PR author types reaches the shell.
      - name: Run this shard's specs
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          files=$(jq -r --argjson i "$SHARD" '.[$i][]' e2e/shards.json | tr '\n' ' ')
          echo "shard $SHARD: $files"
          test -n "$files"
          npx firebase emulators:exec --only auth,firestore,database --project quiz-d686e "npx playwright test $files"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore

  # The required check. The ruleset names "Playwright against emulators", and a
  # matrix job reports one check per shard under other names, so this one job
  # stands for all of them. It runs whenever the shards were meant to, and
  # fails unless every shard passed. Skipped when the build did not pass —
  # docs only, a reused PR build, or a broken build that verify already fails —
  # since a skipped required check passes. `rules` and `deploy` need this job
  # and verify, so they still wait on every shard and every check.
  e2e:
    name: Playwright against emulators
    needs: [build, e2e-shard]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "shards: $SHARDS"
          test "$SHARDS" = success

  # Publishes both rulesets named in firebase.json — firestore.rules and
  # database.rules.json — once verify and e2e have passed. e2e has just run these
  # same two files in the emulator, so what goes live is what was exercised.
  # Until W2 they were pasted into the console by hand, this repo's most repeated
  # failure (docs/decisions/ci-deploy.md, "Rules from CI").
  #
  # Keyless (D5): GitHub's OIDC token is swapped for a short-lived token for one
  # service account that holds the rules roles and nothing else. The pool admits
  # only this repository's `master` (an attribute condition on repository_id and
  # ref), so a pull request, a fork or another branch is refused by Google even
  # if the `if` below were wrong. The two variables name the provider and the
  # account; they identify, they do not authorise, so they are not secrets.
  #
  # firebase-tools checks both files against the live project before it releases
  # either: the RTDB rules by a dry-run PUT, the Firestore rules by the Rules
  # API's compile. A file that does not compile stops this job having published
  # nothing. Read off firebase-tools' deploy/index.js (every prepare runs before
  # any release) and proved with `--dry-run`, 15 October 2026.
  #
  # Before `deploy`, so a client never goes live ahead of the rules it needs, and
  # a failed publish holds the site back too. It does not make a breaking rule
  # safe: tabs still open run the old bundle against the new rules the moment
  # this finishes. A rule that would refuse the old client still needs
  # expand-then-contract (public-scale.md, W3).
  rules:
    name: Publish rules to Firebase
    needs: [plan, verify, e2e]
    # Either this run built and tested the code, or Plan found a passed PR run
    # that built this exact tree. Docs only: neither, so nothing is published.
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/master'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && ((needs.verify.result == 'success' && needs.e2e.result == 'success')
          || (needs.plan.result == 'success' && needs.plan.outputs.code == 'true'
              && needs.plan.outputs.reuse_run != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job ask GitHub for the OIDC token that Google's pool checks.
      # Granted to this job alone; no other job can mint a Google credential.
      id-token: write
    # One publish at a time; the newest queued run wins, which is the newest
    # master.
    concurrency:
      group: firebase-rules
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The lockfile's firebase-tools: the same version that ran the emulator in
      # e2e. No install scripts: this job can mint a Google credential (see the
      # head of this file). firebase-tools needs none — re2, the one native
      # module under it, is superstatic's optional regex engine for hosting.
      - run: npm ci --ignore-scripts

      # Pinned to the commit behind v3.0.0, not the tag: it is the one action
      # here from outside GitHub, in the only job that can change the rules, and
      # a tag can be moved. Declares `runs.using: node24` (its action.yml at that
      # commit). Writes an external-account credentials file and exports
      # GOOGLE_APPLICATION_CREDENTIALS, which firebase-tools reads through
      # google-auth-library when nobody is logged in (lib/requireAuth.js).
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RULES_SERVICE_ACCOUNT }}

      - name: Publish both rulesets
        run: npx firebase deploy --only firestore:rules,database --project quiz-d686e --non-interactive

  deploy:
    name: Publish to gh-pages
    # After `rules`: see that job. Since `rules` runs only on `master`, so does
    # this, a manual run included. Until W2 a workflow_dispatch from any other
    # branch could publish that branch's site, which is the drift this file
    # exists to stop.
    needs: [plan, verify, e2e, rules]
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/master'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.rules.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # The repository default is read-only, so this is not decoration: without
      # it the push to `gh-pages` is rejected.
      contents: write
      # Downloading a passed PR run's `dist`, when Plan chose to reuse one.
      actions: read
    # Never two deploys writing the branch at once. Not cancel-in-progress: an
    # interrupted push can leave `gh-pages` half-written, and a queued deploy is
    # cheaper than a broken site.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      # Not left in .git/config. checkout writes the job's token there by
      # default, where every later step — `npm ci` and anything it runs
      # included — can read it. Publish clones and pushes through its own
      # `--repo` URL (gh-pages lib/index.js: `getRepo` returns `options.repo`,
      # and `Git.clone` uses it), so the token goes to that one step's env.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # No install scripts: see the head of this file.
      - run: npm ci --ignore-scripts

      # This run's build, when it made one.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.verify.result == 'success'
        with:
          name: dist
          path: dist

      # Otherwise the pull-request run Plan chose: same tree, already through
      # verify and e2e. The secret check below still runs on these bytes.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.verify.result != 'success'
        with:
          name: dist
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.plan.outputs.reuse_run }}

      - name: Check the artefact carries no secret
        # The API key is public and is inlined by the same mechanism as the
        # secret, so check-bundle uses it as a canary: if the search cannot find
        # a value that is definitely there, its silence about anything else is
        # worthless. Passing it here is what makes this step mean something.
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
        run: npm run check-bundle

      - name: Publish
        # The author is deliberately not `github-actions[bot]`. `gh-pages` parses
        # `--user` with RFC 5322, where `[` and `]` are specials, so both the
        # bracketed display name *and* the bracketed noreply local-part are
        # rejected — quoting does not rescue either. Checked against the library
        # rather than guessed.
        #
        # A useful side effect: gh-pages commits up to 10 September were authored
        # by Greg, so the author now says at a glance whether a deploy came from
        # CI or from somebody's laptop. That is the exact question this whole
        # workstream exists to answer.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx gh-pages \
            --dist dist \
            --user "GitHub Actions <actions@github.com>" \
            --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --message "Deploy ${GITHUB_SHA}"

  # The merged PR's tickets go to Done once it is live (PROJ-72). Until 28
  # October 2026 that was a rule an agent had to remember, and PROJ-60 and
  # PROJ-61 sat at To Do for five days after #140 shipped them. Which keys
  # count, and why an epic never closes here: .github/scripts/jira-done.sh.
  #
  # After a successful deploy, or after a docs-only merge, which deploys
  # nothing and so is live on merge. A failed deploy moves nothing. The token
  # lives in the `jira` environment, which only `master` may use: this repo is
  # public, and a branch's workflow cannot read a secret it cannot reach.
  jira:
    name: Move merged tickets to Done
    needs: [plan, deploy]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && (needs.deploy.result == 'success'
          || (needs.plan.result == 'success' && needs.plan.outputs.code == 'false')) }}
    runs-on: ubuntu-latest
    environment: jira
    permissions:
      contents: read
      # The commits-to-pulls API, to find the PR this merge came from.
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Move tickets
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: .github/scripts/jira-done.sh
